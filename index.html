<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncDrop - 异地原画影音私密同步</title>
    <!-- 可爱显眼的标签栏图标：戴耳机的发光萌猫 (SVG 内联无需外链) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧🐱</text></svg>">
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e0e0e0; padding: 15px; }
        .card { background: #1a1d24; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #2d3139; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; color: #ff758c; text-align: center; }
        input[type="text"], button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #333; font-size: 14px; }
        input[type="text"] { background: #262930; color: #fff; }
        button { background: #ff758c; color: #fff; font-weight: bold; cursor: pointer; border: none; }
        button:active { filter: brightness(0.85); }
        .row-btn { display: flex; gap: 8px; }
        .btn-sub { background: #374151; font-size: 12px; }
        
        /* 播放器与音乐模式切换 */
        .player-wrapper { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; min-height: 220px; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 55vh; display: block; }
        
        /* 音乐模式：黑胶唱片特效 */
        .music-view { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 260px; background: radial-gradient(circle, #2a2d36 0%, #111215 100%); }
        .vinyl { width: 150px; height: 150px; border-radius: 50%; background: repeating-radial-gradient(#111, #111 4px, #222 5px, #111 6px); border: 4px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; animation: rotate 8s linear infinite; animation-play-state: paused; }
        .vinyl-center { width: 45px; height: 45px; border-radius: 50%; background: #ff758c; border: 3px solid #fff; }
        .music-title { margin-top: 15px; font-size: 14px; color: #ff758c; font-weight: bold; }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .progress-box { margin: 10px 0; display: none; }
        .bar-bg { background: #333; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .bar-fill { background: #00c853; height: 100%; width: 0%; transition: width 0.1s; }
        .status { font-size: 13px; color: #aaa; text-align: center; margin: 5px 0; word-break: break-all; }
        .badge { background: #2d3748; padding: 4px 8px; border-radius: 4px; font-family: monospace; color: #ff758c; cursor: pointer; display: inline-block; }
        .security-tag { font-size: 11px; color: #4caf50; display: inline-block; margin-top: 4px; }
    </style>
</head>
<body>

    <h2>🎧 SyncDrop 异地私密影音室</h2>

    <!-- 1. 连接面板 -->
    <div class="card">
        <div class="status">
            你的私密配对码 (点击复制): 
            <span id="myId" class="badge" title="点击即可复制">正在建立安全信道...</span>
            <div class="security-tag">🔒 DTLS 端到端硬件级加密传输 · 防偷听密室</div>
        </div>
        <div class="row-btn">
            <button id="copyRoomLinkBtn" class="btn-sub">🔗 复制专属房间链接（发给对方一键进入）</button>
        </div>
        <input type="text" id="targetId" placeholder="粘贴对方配对码">
        <button id="connBtn">进入专属双人密室</button>
        <div id="connStatus" class="status" style="color: #ff9800; font-weight: bold;">状态: 准备就绪</div>
    </div>

    <!-- 2. 片源与音乐选择 -->
    <div class="card">
        <div style="font-size: 14px; font-weight: bold; margin-bottom: 6px;">🎵 音视频源选择（支持视频/歌曲）</div>
        
        <!-- 在线流与网易云音乐链接解析 -->
        <input type="text" id="onlineUrl" placeholder="粘贴在线视频(.m3u8/.mp4) 或 网易云歌曲分享链接">
        <button id="loadUrlBtn" style="background: #3b82f6;">同步载入网络音频/视频</button>

        <!-- 本地上传 -->
        <div style="margin-top: 10px;">
            <span style="font-size: 12px; color: #aaa;">或者上传本地无损音频(MP3/FLAC)或高清电影：</span>
            <input type="file" id="fileInput" accept="video/*,audio/*" style="margin-top: 4px;">
        </div>

        <div class="progress-box" id="progressBox">
            <div style="font-size: 12px; display: flex; justify-content: space-between;">
                <span id="transStatus">正在传输原件...</span>
                <span id="transPercent">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
        </div>
    </div>

    <!-- 3. 双模播放器（视频/黑胶唱片模式自动切换） -->
    <div class="card" style="padding: 10px;">
        <div class="player-wrapper">
            <!-- 视频容器 -->
            <video id="player" controls playsinline webkit-playsinline></video>
            <!-- 音乐黑胶唱片模式容器 -->
            <div id="musicView" class="music-view">
                <div class="vinyl" id="vinyl"><div class="vinyl-center"></div></div>
                <div class="music-title" id="musicTitle">正在播放音频...</div>
            </div>
        </div>
    </div>

<script>
    const CHUNK_SIZE = 32 * 1024;
    let peer = null, conn = null, hls = null;
    let isRemoteAction = false;
    let isAudioMode = false;

    let receivedChunks = [], receivedBytes = 0, expectedFileSize = 0, fileMeta = null;

    const myIdEl = document.getElementById('myId');
    const copyRoomLinkBtn = document.getElementById('copyRoomLinkBtn');
    const targetIdEl = document.getElementById('targetId');
    const connBtn = document.getElementById('connBtn');
    const connStatusEl = document.getElementById('connStatus');
    const onlineUrlInput = document.getElementById('onlineUrl');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const fileInput = document.getElementById('fileInput');
    const player = document.getElementById('player');
    const progressBox = document.getElementById('progressBox');
    const barFill = document.getElementById('barFill');
    const transPercent = document.getElementById('transPercent');
    const transStatus = document.getElementById('transStatus');
    const musicView = document.getElementById('musicView');
    const vinyl = document.getElementById('vinyl');
    const musicTitle = document.getElementById('musicTitle');

    // 1. 初始化 PeerJS
    peer = new Peer({
        config: {
            iceServers: [
                { urls: 'stun:stun.miwifi.com:3478' },
                { urls: 'stun:stun.chat.bilibili.com:3478' },
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', id => {
        myIdEl.innerText = id;
        connStatusEl.innerText = "状态: 安全信道就绪";
        const lastTarget = localStorage.getItem('syncdrop_last_peer');
        if (lastTarget && lastTarget !== id) {
            targetIdEl.value = lastTarget;
            connectToPeer(lastTarget);
        }
    });

    // 2. 防偷听机制：如果已建立连接，严禁第三者接入
    peer.on('connection', incomingConn => {
        if (conn && conn.open) {
            console.warn("检测到未授权的第三方尝试接入，已自动拒绝连接！");
            incomingConn.close();
            return;
        }
        conn = incomingConn;
        localStorage.setItem('syncdrop_last_peer', incomingConn.peer);
        bindConnEvents();
    });

    myIdEl.onclick = () => copyText(myIdEl.innerText, "已复制配对码！");

    copyRoomLinkBtn.onclick = () => {
        const roomUrl = `${window.location.origin}${window.location.pathname}?connect=${myIdEl.innerText}`;
        copyText(roomUrl, "已复制专属房间链接！直接发给对方打开即可。");
    };

    function copyText(text, msg) {
        navigator.clipboard.writeText(text).then(() => alert(msg)).catch(() => prompt("请复制：", text));
    }

    const urlParams = new URLSearchParams(window.location.search);
    const autoTarget = urlParams.get('connect');

    connBtn.onclick = () => {
        const dest = targetIdEl.value.trim();
        if (dest) connectToPeer(dest);
    };

    function connectToPeer(destId) {
        if (destId === myIdEl.innerText) return;
        connStatusEl.innerText = "⏳ 正在建立双人加密隧道...";
        conn = peer.connect(destId, { reliable: true });
        localStorage.setItem('syncdrop_last_peer', destId);
        bindConnEvents();
    }

    if (autoTarget) setTimeout(() => connectToPeer(autoTarget), 1000);

    function bindConnEvents() {
        conn.on('open', () => {
            connStatusEl.innerText = "🔒 专属密室已锁死：仅限你们两人，防偷听已生效";
            connStatusEl.style.color = "#00c853";
        });

        conn.on('close', () => {
            connStatusEl.innerText = "⚠️ 对方已离开房间";
            connStatusEl.style.color = "#ff5252";
        });

        conn.on('data', data => {
            if (data.type === 'sync') {
                isRemoteAction = true;
                if (Math.abs(player.currentTime - data.time) > 0.4) {
                    player.currentTime = data.time;
                }
                if (data.action === 'play') player.play().catch(()=>{});
                if (data.action === 'pause') player.pause();
                setTimeout(() => isRemoteAction = false, 150);
            }
            else if (data.type === 'load-url') {
                parseAndPlayUrl(data.url, data.isAudio, data.title);
            }
            else if (data.type === 'file-start') {
                fileMeta = data;
                expectedFileSize = data.size;
                receivedBytes = 0;
                receivedChunks = [];
                progressBox.style.display = 'block';
                transStatus.innerText = "对方正在给你传输高清原件...";
            }
            else if (data.type === 'file-chunk') {
                receivedChunks.push(data.chunk);
                receivedBytes += data.chunk.byteLength;
                const percent = Math.min(100, Math.round((receivedBytes / expectedFileSize) * 100));
                barFill.style.width = percent + '%';
                transPercent.innerText = percent + '%';

                if (receivedBytes >= expectedFileSize) {
                    transStatus.innerText = "🎉 缓冲完毕！已加载本地文件";
                    const isAudio = fileMeta.mime.startsWith('audio');
                    setUIMode(isAudio, fileMeta.name);
                    const blob = new Blob(receivedChunks, { type: fileMeta.mime });
                    player.src = URL.createObjectURL(blob);
                    receivedChunks = [];
                }
            }
        });
    }

    // 3. UI 模式切换（视频 / 黑胶唱片模式）
    function setUIMode(audioMode, title = "正在同步收听音频...") {
        isAudioMode = audioMode;
        if (audioMode) {
            player.style.display = 'none';
            musicView.style.display = 'flex';
            musicTitle.innerText = "🎵 " + title;
        } else {
            player.style.display = 'block';
            musicView.style.display = 'none';
        }
    }

    // 4. 网易云与在线音视频链接解析器
    function parseAndPlayUrl(rawUrl, forceAudio = false, customTitle = "") {
        let finalUrl = rawUrl.trim();
        let isAudio = forceAudio;
        let title = customTitle || "在线流媒体";

        // 网易云音乐智能嗅探
        const neteaseMatch = finalUrl.match(/id=(\d+)/);
        if (finalUrl.includes('163.com') && neteaseMatch) {
            const songId = neteaseMatch[1];
            finalUrl = `https://music.163.com/song/media/outer/url?id=${songId}.mp3`;
            isAudio = true;
            title = `网易云单曲 (ID: ${songId})`;
        } else if (finalUrl.match(/\.(mp3|flac|wav|m4a|aac)($|\?)/i)) {
            isAudio = true;
            title = "网络音频";
        }

        setUIMode(isAudio, title);

        if (finalUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(finalUrl);
                hls.attachMedia(player);
            } else {
                player.src = finalUrl;
            }
        } else {
            if (hls) { hls.destroy(); hls = null; }
            player.src = finalUrl;
        }

        return { finalUrl, isAudio, title };
    }

    loadUrlBtn.onclick = () => {
        const raw = onlineUrlInput.value.trim();
        if (!raw) return alert("请先输入链接！");
        const { finalUrl, isAudio, title } = parseAndPlayUrl(raw);
        if (conn && conn.open) {
            conn.send({
                type: 'load-url',
                url: finalUrl,
                isAudio: isAudio,
                title: title
            });
        }
    };

    // 5. 本地音视频文件上传
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file || !conn || !conn.open) {
            if (!conn || !conn.open) alert("请先成功连接对方！");
            return;
        }

        const isAudio = file.type.startsWith('audio') || file.name.match(/\.(mp3|flac|wav|m4a|aac)$/i);
        setUIMode(isAudio, file.name);
        player.src = URL.createObjectURL(file);

        conn.send({
            type: 'file-start',
            name: file.name,
            size: file.size,
            mime: file.type || (isAudio ? 'audio/mp3' : 'video/mp4')
        });

        progressBox.style.display = 'block';
        transStatus.innerText = "正在无损传输给对方...";

        let offset = 0;
        const reader = new FileReader();
        function readSlice(o) {
            reader.readAsArrayBuffer(file.slice(o, o + CHUNK_SIZE));
        }

        reader.onload = (evt) => {
            conn.send({ type: 'file-chunk', chunk: evt.target.result });
            offset += evt.target.result.byteLength;
            const percent = Math.min(100, Math.round((offset / file.size) * 100));
            barFill.style.width = percent + '%';
            transPercent.innerText = percent + '%';

            if (offset < file.size) {
                if (conn.dataChannel.bufferedAmount > 2 * 1024 * 1024) {
                    setTimeout(() => readSlice(offset), 50);
                } else {
                    readSlice(offset);
                }
            } else {
                transStatus.innerText = "✅ 传输完成！双方均已加载";
            }
        };
        readSlice(0);
    };

    // 6. 状态同步与黑胶唱片动画联动
    function sendSync(action) {
        if (conn && conn.open && !isRemoteAction) {
            conn.send({
                type: 'sync',
                action: action,
                time: player.currentTime
            });
        }
    }

    player.addEventListener('play', () => {
        vinyl.style.animationPlayState = 'running';
        sendSync('play');
    });

    player.addEventListener('pause', () => {
        vinyl.style.animationPlayState = 'paused';
        sendSync('pause');
    });

    player.addEventListener('seeked', () => sendSync('seek'));
</script>
</body>
</html>
