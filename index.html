<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>异地私密影音同步</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { font-size: 1.2rem; margin-bottom: 10px; color: #4facfe; text-align: center; }
        input[type="text"], button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; font-size: 14px; }
        input[type="text"] { background: #2a2a2a; color: #fff; }
        button { background: #0070f3; color: #fff; font-weight: bold; cursor: pointer; border: none; }
        button:disabled { background: #444; }
        video { width: 100%; max-height: 55vh; background: #000; border-radius: 8px; margin-top: 10px; display: block; }
        .progress-box { margin: 10px 0; display: none; }
        .bar-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .bar-fill { background: #00c853; height: 100%; width: 0%; transition: width 0.1s; }
        .status { font-size: 13px; color: #aaa; text-align: center; margin: 5px 0; }
        .badge { background: #2d3748; padding: 2px 6px; border-radius: 4px; font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>

    <h2>异地影院 (P2P 原画直连)</h2>

    <div class="card">
        <div class="status">我的连接码: <span id="myId" class="badge">正在获取...</span></div>
        <input type="text" id="targetId" placeholder="在此粘贴对方的连接码">
        <button id="connBtn">连接对方</button>
        <div id="connStatus" class="status" style="color: #ff9800;">状态: 尚未建立连结</div>
    </div>

    <div class="card">
        <label style="font-size: 14px; font-weight: bold;">发片方选择文件（视频/音频）：</label>
        <input type="file" id="fileInput" accept="video/*,audio/*" style="margin-top: 8px;">
        
        <div class="progress-box" id="progressBox">
            <div style="font-size: 12px; display: flex; justify-content: space-between;">
                <span id="transStatus">正在传输高清原件...</span>
                <span id="transPercent">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
        </div>
    </div>

    <div class="card" style="padding: 10px;">
        <video id="player" controls playsinline webkit-playsinline></video>
    </div>

<script>
    const CHUNK_SIZE = 32 * 1024; // 32KB 每次分块传输（平衡移动端内存与网络吞吐）
    let peer = null, conn = null;
    let isRemoteAction = false;

    // 文件传输相关缓存
    let receivedChunks = [];
    let receivedBytes = 0;
    let expectedFileSize = 0;
    let fileMeta = null;

    const myIdEl = document.getElementById('myId');
    const targetIdEl = document.getElementById('targetId');
    const connBtn = document.getElementById('connBtn');
    const connStatusEl = document.getElementById('connStatus');
    const fileInput = document.getElementById('fileInput');
    const player = document.getElementById('player');
    const progressBox = document.getElementById('progressBox');
    const barFill = document.getElementById('barFill');
    const transPercent = document.getElementById('transPercent');
    const transStatus = document.getElementById('transStatus');

    // 1. 初始化 WebRTC 客户端（直接使用公共中继，无需域名和公网IP）
    peer = new Peer({
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', id => myIdEl.innerText = id);
    peer.on('connection', c => { conn = c; initConn(); });

    connBtn.onclick = () => {
        const dest = targetIdEl.value.trim();
        if (dest) {
            conn = peer.connect(dest, { reliable: true });
            initConn();
        }
    };

    function initConn() {
        conn.on('open', () => {
            connStatusEl.innerText = "✅ 双方已成功建立 P2P 隧道！";
            connStatusEl.style.color = "#00c853";
        });

        conn.on('data', data => {
            // A. 控制指令同步
            if (data.type === 'sync') {
                isRemoteAction = true;
                if (Math.abs(player.currentTime - data.time) > 0.4) {
                    player.currentTime = data.time;
                }
                if (data.action === 'play') player.play().catch(()=>{});
                if (data.action === 'pause') player.pause();
                setTimeout(() => isRemoteAction = false, 150);
            }
            // B. 接收文件元信息
            else if (data.type === 'file-start') {
                fileMeta = data;
                expectedFileSize = data.size;
                receivedBytes = 0;
                receivedChunks = [];
                progressBox.style.display = 'block';
                transStatus.innerText = "对方正在给你传输原画文件，请稍候...";
            }
            // C. 接收二进制文件切片
            else if (data.type === 'file-chunk') {
                receivedChunks.push(data.chunk);
                receivedBytes += data.chunk.byteLength;
                
                const percent = Math.min(100, Math.round((receivedBytes / expectedFileSize) * 100));
                barFill.style.width = percent + '%';
                transPercent.innerText = percent + '%';

                if (receivedBytes >= expectedFileSize) {
                    transStatus.innerText = "🎉 缓冲完毕！已加载本地高清原片";
                    const blob = new Blob(receivedChunks, { type: fileMeta.mime });
                    player.src = URL.createObjectURL(blob);
                    receivedChunks = []; // 释放内存
                }
            }
        });
    }

    // 2. 选择文件并分片发送（带背压处理，保证弱网不崩溃）
    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file || !conn || !conn.open) {
            if (!conn || !conn.open) alert("请先连接对方！");
            return;
        }

        // 本地立即播放
        player.src = URL.createObjectURL(file);

        // 通知对方准备接收
        conn.send({
            type: 'file-start',
            name: file.name,
            size: file.size,
            mime: file.type || 'video/mp4'
        });

        progressBox.style.display = 'block';
        transStatus.innerText = "正在发送原画到对方设备...";

        let offset = 0;
        const reader = new FileReader();

        function readSlice(o) {
            const slice = file.slice(o, o + CHUNK_SIZE);
            reader.readAsArrayBuffer(slice);
        }

        reader.onload = (evt) => {
            conn.send({ type: 'file-chunk', chunk: evt.target.result });
            offset += evt.target.result.byteLength;

            const percent = Math.min(100, Math.round((offset / file.size) * 100));
            barFill.style.width = percent + '%';
            transPercent.innerText = percent + '%';

            if (offset < file.size) {
                // 背压控制：防止发得太快撑爆 WebRTC 内部缓冲区
                if (conn.dataChannel.bufferedAmount > 2 * 1024 * 1024) {
                    setTimeout(() => readSlice(offset), 50);
                } else {
                    readSlice(offset);
                }
            } else {
                transStatus.innerText = "✅ 传输完成，对方已收到高清原件！";
            }
        };

        readSlice(0);
    };

    // 3. 播放器行为同步通知对方
    function sendSync(action) {
        if (conn && conn.open && !isRemoteAction) {
            conn.send({
                type: 'sync',
                action: action,
                time: player.currentTime
            });
        }
    }

    player.addEventListener('play', () => sendSync('play'));
    player.addEventListener('pause', () => sendSync('pause'));
    player.addEventListener('seeked', () => sendSync('seek'));
</script>
</body>
</html>
